name: Build & Deliver APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "whisper.server.url=${{ secrets.WHISPER_SERVER_URL }}" >> local.properties
          echo "whisper.auth=${{ secrets.WHISPER_AUTH }}" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version name
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName 2>/dev/null || grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | head -1 | tr -d '"')
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astaro-scribe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Send APK to Telegram
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          SHORT_SHA=$(git rev-parse --short HEAD)
          CAPTION="📱 *Astaro Scribe ${{ steps.version.outputs.name }}*

          \`${SHORT_SHA}\` ${COMMIT_MSG}"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown" \
            | tee /tmp/tg_response.json

          # fail if Telegram returned ok:false
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/tg_response.json'))
          if not r.get('ok'):
              print('Telegram error:', r)
              sys.exit(1)
          "
